name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check metadata, duplicate IDs, and local links
        run: python scripts/check-site.py
      - name: Check guide signup endpoint
        run: node scripts/check-endpoint.mjs
